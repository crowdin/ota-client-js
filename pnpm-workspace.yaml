# Dependency install scripts are blocked by default; only the packages listed
# here may run them. esbuild is the native binary behind tsup.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@babel/helpers@7.26.10'
  - js-yaml@3.15.0 || 3.15.1 || 3.15.2
  - '@babel/core@7.29.1'
  - brace-expansion@2.1.2 || 2.1.3 || 2.1.4 || 2.1.5 || 2.1.6 || 2.1.7
  - browserslist@4.28.7
  - '@humanfs/node@0.16.8'
  - sprintf-js@1.1.4
